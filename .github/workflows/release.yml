name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  checks:
    name: checks
    uses: ./.github/workflows/ci.yml

  release:
    name: GitHub Release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract changelog section
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::标签 ${tag} 不是语义化版本。请使用 vX.Y.Z 或 vX.Y.Z-预发布。"
            exit 1
          fi
          version="${tag#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [[ "$pkg_version" != "$version" ]]; then
            echo "::error::package.json 版本 ${pkg_version} 与标签 ${tag} 不一致。"
            exit 1
          fi
          awk -v ver="$version" '
            BEGIN { found = 0 }
            $0 ~ "^##[[:space:]]+" ver "([[:space:]]|$)" { found = 1; print; next }
            found && /^##[[:space:]]/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "::error::CHANGELOG.md 中没有 ## ${version} 这一节。"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
